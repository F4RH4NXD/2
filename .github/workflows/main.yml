name: RDP + Tailscale + RustDesk + CRD (ULTIMATE STREAMING FIX)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet", required: true }
      ts_api_key:         { description: "Tailscale API key", required: true }
      ts_authkey:         { description: "Tailscale Auth key", required: true }
      quick_test:         { description: "Run 5-minute test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime (max 360)", required: false, default: "355" }
      do_purge:           { description: "Purge bullet* devices", required: false, default: "true" }
      cycles:             { description: "0=stop after A; N=handoffs", required: false, default: "0" }
      rdp_count:          { description: "How many RDP instances (1-10)", required: false, default: "1" }
      crd_code:
        description: "CRD code (4/0AV...)"
        required: false
        default: ""
      crd_pin:
        description: "CRD PIN (6–12 digits)"
        required: false
        default: "123456"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi:  ${{ steps.mk.outputs.multi }}
    steps:
      - id: mk
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          if ($crd.Length -gt 0) { $n = 1 } else {
            $n = [int]"${{ inputs.rdp_count }}"; if ($n -lt 1) { $n = 1 }; if ($n -gt 10) { $n = 10 }
          }
          $inc = @(); for ($i=1; $i -le $n; $i++){ $inc += @{ id = $i } }
          $json = @{ include = $inc } | ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $multi = if ($n -gt 1) { '1' } else { '0' }
          "multi=$multi" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  rdp:
    needs: setup
    runs-on: windows-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10
    timeout-minutes: 370
    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345

    steps:
      # ============ ULTIMATE STREAMING PROTECTION ============
      - name: GUARANTEE STREAMING NEVER STOPS
        run: |
          Write-Host "🔥🔥🔥 ACTIVATING ULTIMATE STREAMING PROTECTION 🔥🔥🔥"
          
          # 1. MATIIN SEMUA TIMEOUT
          $settings = @{
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" = @{
              "fResetBrokenOnTimeout" = 0
              "fDenyTSConnections" = 0
              "fSingleSessionPerUser" = 0
              "AllowRemoteRPC" = 1
              "fAllowToGetHelp" = 1
            }
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" = @{
              "MaxDisconnectionTime" = 0
              "MaxConnectionTime" = 0
              "MaxIdleTime" = 0
              "UserTimeout" = 0
              "fDisableAutoReconnect" = 1
              "fInheritMaxSessionTime" = 0
              "fInheritMaxDisconnectionTime" = 0
              "fInheritMaxIdleTime" = 0
            }
            "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" = @{
              "fResetBrokenOnTimeout" = 0
              "MaxDisconnectionTime" = 0
              "MaxConnectionTime" = 0
              "MaxIdleTime" = 0
              "fAllowUnsolicited" = 1
            }
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" = @{
              "InactivityTimeoutSecs" = 0
              "PromptOnSecureDesktop" = 0
              "DontDisplayLockScreen" = 1
              "DisableLockScreen" = 1
            }
            "HKCU:\Control Panel\Desktop" = @{
              "ScreenSaveActive" = "0"
              "SCRNSAVE.EXE" = ""
              "ScreenSaverIsSecure" = "0"
              "ScreenSaveTimeOut" = "0"
            }
          }
          
          foreach ($path in $settings.Keys) {
            New-Item -Path $path -Force -ErrorAction SilentlyContinue | Out-Null
            foreach ($key in $settings[$path].Keys) {
              $value = $settings[$path][$key]
              $type = if ($value -is [int]) { "DWord" } else { "String" }
              Set-ItemProperty -Path $path -Name $key -Value $value -Type $type -ErrorAction SilentlyContinue
            }
          }
          
          # 2. MATIIN POWER SAVING
          powercfg -setacvalueindex SCHEME_CURRENT SUB_VIDEO VIDEOIDLE 0
          powercfg -setacvalueindex SCHEME_CURRENT SUB_VIDEO VIDEOCONLOCK 0
          powercfg -setacvalueindex SCHEME_CURRENT SUB_VIDEO VIDEODIM 0
          powercfg -setacvalueindex SCHEME_CURRENT SUB_VIDEO VIDEODIM 0
          powercfg -setacvalueindex SCHEME_CURRENT SUB_VIDEO VIDEOTIMEOUT 0
          powercfg -setdcvalueindex SCHEME_CURRENT SUB_VIDEO VIDEOIDLE 0
          powercfg -setdcvalueindex SCHEME_CURRENT SUB_VIDEO VIDEOCONLOCK 0
          powercfg -setdcvalueindex SCHEME_CURRENT SUB_VIDEO VIDEODIM 0
          powercfg -setdcvalueindex SCHEME_CURRENT SUB_VIDEO VIDEOTIMEOUT 0
          powercfg -setacvalueindex SCHEME_CURRENT SUB_SLEEP STANDBYIDLE 0
          powercfg -setdcvalueindex SCHEME_CURRENT SUB_SLEEP STANDBYIDLE 0
          powercfg -setacvalueindex SCHEME_CURRENT SUB_SLEEP HIBERNATEIDLE 0
          powercfg -setdcvalueindex SCHEME_CURRENT SUB_SLEEP HIBERNATEIDLE 0
          powercfg -change -monitor-timeout-ac 0
          powercfg -change -monitor-timeout-dc 0
          powercfg -change -standby-timeout-ac 0
          powercfg -change -standby-timeout-dc 0
          powercfg -change -hibernate-timeout-ac 0
          powercfg -change -hibernate-timeout-dc 0
          
          # 3. SET HIGH PERFORMANCE
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          
          # 4. DISABLE SCREEN SAVER VIA REGISTRY
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "ScreenSaveActive" -Value "0" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "SCRNSAVE.EXE" -Value "" -ErrorAction SilentlyContinue
          
          # 5. DISABLE WINDOWS LOCK SCREEN
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization" -Name "NoLockScreen" -Value 1 -Type DWord -ErrorAction SilentlyContinue
          
          # 6. DISABLE FAST USER SWITCHING
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "HideFastUserSwitching" -Value 1 -Type DWord -ErrorAction SilentlyContinue
          
          # 7. DISABLE DISPLAY TURN OFF
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Power\User\PowerSchemes" -Name "VideoTimeout" -Value 0 -ErrorAction SilentlyContinue
          
          Write-Host "✅ ULTIMATE STREAMING PROTECTION ACTIVATED! STREAMING WILL NEVER STOP!"

      - name: Create PERSISTENT KEEPALIVE (Multiple Layers)
        run: |
          # LAYER 1: PowerShell Keepalive
          $ps1 = @'
          while ($true) {
            Write-Host "💀 KEEPALIVE: $(Get-Date) - STREAMING AKTIF!"
            Start-Sleep -Seconds 15
          }
          '@
          Set-Content -Path "$env:TEMP\keepalive1.ps1" -Value $ps1 -Encoding UTF8
          Start-Process powershell -ArgumentList "-WindowStyle Hidden -ExecutionPolicy Bypass -File `"$env:TEMP\keepalive1.ps1`"" -WindowStyle Hidden
          
          # LAYER 2: VBS Keepalive (bypass PowerShell restrictions)
          $vbs = @'
          Do While True
            WScript.Sleep 15000
          Loop
          '@
          Set-Content -Path "$env:TEMP\keepalive2.vbs" -Value $vbs -Encoding UTF8
          Start-Process wscript -ArgumentList "$env:TEMP\keepalive2.vbs" -WindowStyle Hidden
          
          # LAYER 3: CMD Keepalive
          $cmd = @'
          @echo off
          :loop
          echo KEEPALIVE - STREAMING ACTIVE
          timeout /t 15 /nobreak >nul
          goto loop
          '@
          Set-Content -Path "$env:TEMP\keepalive3.cmd" -Value $cmd -Encoding ASCII
          Start-Process cmd -ArgumentList "/c start /min `"$env:TEMP\keepalive3.cmd`"" -WindowStyle Hidden
          
          # LAYER 4: Scheduled Task Keepalive
          $taskXml = @'
          <?xml version="1.0" encoding="UTF-16"?>
          <Task version="1.2" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task">
            <Triggers>
              <BootTrigger>
                <Enabled>true</Enabled>
              </BootTrigger>
              <SessionStateChangeTrigger>
                <Enabled>true</Enabled>
                <StateChange>SessionUnlock</StateChange>
              </SessionStateChangeTrigger>
            </Triggers>
            <Settings>
              <DisallowStartIfOnBatteries>false</DisallowStartIfOnBatteries>
              <StopIfGoingOnBatteries>false</StopIfGoingOnBatteries>
              <WakeToRun>true</WakeToRun>
              <ExecutionTimeLimit>PT0S</ExecutionTimeLimit>
              <Priority>4</Priority>
            </Settings>
            <Actions Context="Author">
              <Exec>
                <Command>powershell.exe</Command>
                <Arguments>-WindowStyle Hidden -ExecutionPolicy Bypass -Command "while($true){Start-Sleep 30}"</Arguments>
              </Exec>
            </Actions>
          </Task>
          '@
          $taskXml | Out-File -FilePath "$env:TEMP\keepalive_task.xml" -Encoding UTF8
          schtasks /create /tn "StreamingKeepalive" /xml "$env:TEMP\keepalive_task.xml" /f 2>$null
          schtasks /run /tn "StreamingKeepalive" 2>$null
          
          Write-Host "✅ 4 LAYERS OF KEEPALIVE ACTIVATED! STREAMING WILL NEVER STOP!"

      - name: BLOCK Windows from entering idle state
        run: |
          # Disable idle detection completely
          New-Item -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power" -Name "HiberbootEnabled" -Value 0 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power" -Name "SleepStudyDisabled" -Value 1 -Type DWord -ErrorAction SilentlyContinue
          
          # Disable screen saver
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "ScreenSaveActive" -Value "0" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "SCRNSAVE.EXE" -Value "" -ErrorAction SilentlyContinue
          
          # Prevent system from sleeping
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Power" -Name "HibernateEnabled" -Value 0 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Power" -Name "HibernateEnabledDefault" -Value 0 -Type DWord -ErrorAction SilentlyContinue
          
          Write-Host "✅ IDLE STATE BLOCKED!"

      - name: CRD Setup
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          if ($crd.Length -gt 0) { 
            "CRD_ENABLED=1" | Out-File -Append $env:GITHUB_ENV
          } else { 
            "CRD_ENABLED=0" | Out-File -Append $env:GITHUB_ENV 
          }

      - name: Install CRD
        if: env.CRD_ENABLED == '1'
        run: |
          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $exe)) {
            $exePath = "$env:TEMP\chromeremotedesktophost.exe"
            try {
              Invoke-WebRequest -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" -OutFile $exePath -ErrorAction Stop
              Start-Process -FilePath $exePath -ArgumentList "/silent","/install" -Wait
              Remove-Item $exePath -Force
            } catch {
              $msi = "$env:TEMP\chromeremotedesktophost.msi"
              Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile $msi -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait
              Remove-Item $msi -Force
            }
          }

      - name: Run CRD
        if: env.CRD_ENABLED == '1'
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          $pin = "${{ inputs.crd_pin }}".Trim()
          $starter = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $starter)) { exit 1 }
          if ($raw -match '--code\s*=\s*"?([^"\s]+)') { $code = ([regex]::Match($raw,'--code\s*=\s*"?([^"\s]+)')).Groups[1].Value }
          elseif ($raw -match '^4\/') { $code = $raw }
          if ($code) {
            Start-Process -FilePath $starter -ArgumentList "--code=""$code""","--redirect-url=""https://remotedesktop.google.com/_/oauthredirect""","--name=""$Env:COMPUTERNAME""","--pin=""$pin"""
          }

      - name: Tailscale + RDP
        run: |
          $hn = if ("${{ inputs.rdp_count }}" -gt 1) { "bullet${{ matrix.id }}" } else { "bullet" }
          "TS_HOSTNAME=$hn" | Out-File -Append $env:GITHUB_ENV
          $runtime = [int]"${{ inputs.runtime_minutes }}"
          if ("${{ inputs.quick_test }}" -eq "true") { $runtime = 5 }
          if ($runtime -gt 360) { $runtime = 355 }
          if ($runtime -lt 6 -and "${{ inputs.quick_test }}" -ne "true") { $runtime = 355 }
          "RUNTIME_MINUTES=$runtime" | Out-File -Append $env:GITHUB_ENV

      - name: Purge
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |
          if ("${{ inputs.do_purge }}" -eq "true") {
            $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${{ inputs.ts_api_key }}:"))
            $tn = [uri]::EscapeDataString("${{ inputs.ts_tailnet }}")
            $list = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices" -Headers @{ Authorization = "Basic $auth" }
            foreach($d in $list.devices){
              if ($d.hostname -match '^bullet[0-9]*$'){
                Invoke-RestMethod -Method Delete -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" -Headers @{ Authorization = "Basic $auth" } -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Install Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $dst = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $url -OutFile $dst
            Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
            Remove-Item $dst -Force
          }
          & $ts logout 2>$null
          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname "$env:TS_HOSTNAME" --accept-dns=true --accept-routes=true
          $ip4 = & $ts ip -4 | Select-Object -First 1
          "TAILSCALE_IP=$ip4" | Out-File -Append $env:GITHUB_ENV

      - name: Enable RDP
        run: |
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
          }
          Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $u -EA SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -EA SilentlyContinue
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" 2>$null

      - name: Install RustDesk
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rdExe)) {
            try {
              $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"
              $dst = "$env:TEMP\rustdesk.msi"
              Invoke-WebRequest -Uri $url -OutFile $dst
              Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
              Remove-Item $dst -Force
            } catch {
              winget install --id RustDesk.RustDesk -e --silent --accept-package-agreements --accept-source-agreements
            }
          }

      - name: Launch + Screenshot
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (Test-Path $rdExe) { Start-Process $rdExe -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 5
          Add-Type -AssemblyName "System.Windows.Forms","System.Drawing"
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $ss = "$env:TEMP\ss_${{ matrix.id }}.png"
          $bitmap.Save($ss, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()
          $result = curl.exe -s -F "file=@$ss" https://store1.gofile.io/uploadFile
          $json = $result | ConvertFrom-Json
          if ($json.status -eq "ok") { "SCREENSHOT_URL=$($json.data.downloadPage)" | Out-File -Append $env:GITHUB_ENV }

      - name: ULTIMATE STREAMING KEEPALIVE
        run: |
          $mins = [int]"$env:RUNTIME_MINUTES"
          $end = (Get-Date).AddMinutes($mins)
          $msg = "🔥🔥🔥 STREAMING 100% AMAN - TUTUP RDP PAKE X, JANGAN LOGOUT! 🔥🔥🔥"
          Write-Host "████████████████████████████████████████████████████████████████"
          Write-Host "█                                                              █"
          Write-Host "█     🔥 STREAMING PROTECTION ACTIVE - NEVER STOP! 🔥         █"
          Write-Host "█                                                              █"
          Write-Host "█     💀 TUTUP RDP PAKE TOMBOL X - JANGAN LOGOUT! 💀          █"
          Write-Host "█                                                              █"
          Write-Host "█     📡 TAILSCALE IP: $env:TAILSCALE_IP                  █"
          Write-Host "█     👤 USER: $env:RDP_USER / PASS: $env:RDP_PASS █"
          Write-Host "█     📸 SCREENSHOT: $env:SCREENSHOT_URL █"
          Write-Host "█                                                              █"
          Write-Host "████████████████████████████████████████████████████████████████"
          
          while ((Get-Date) -lt $end) {
            Write-Host "💀 $(Get-Date) | STREAMING AKTIF! | SS: $env:SCREENSHOT_URL"
            Start-Sleep -Seconds 30
          }

      - name: Dispatch next
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cycles = [int]"${{ inputs.cycles }}"
          if ($cycles -gt 0) {
            $next = $cycles - 1
            if ($next -le 0) {
              $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"
              $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $body = @{ ref="${{ github.ref_name }}"; inputs = @{ ts_tailnet="${{ inputs.ts_tailnet }}"; ts_api_key="${{ inputs.ts_api_key }}"; base_prefix="bullet"; max_count="10"; dry_run="false" } } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body | Out-Null
            } else {
              $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-B.yml/dispatches"
              $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $payload = @{ ts_tailnet="${{ inputs.ts_tailnet }}"; ts_api_key="${{ inputs.ts_api_key }}"; ts_authkey="${{ inputs.ts_authkey }}"; quick_test="${{ inputs.quick_test }}"; runtime_minutes="${{ inputs.runtime_minutes }}"; do_purge="${{ inputs.do_purge }}"; cycles="$next"; rdp_count="${{ inputs.rdp_count }}"; crd_code="${{ inputs.crd_code }}"; crd_pin="${{ inputs.crd_pin }}" }
              $body = @{ ref="${{ github.ref_name }}"; inputs = $payload } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body | Out-Null
            }
          }
