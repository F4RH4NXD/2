name: RDP + Tailscale + RustDesk + CRD (Streaming Fix)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet", required: true }
      ts_api_key:         { description: "Tailscale API key", required: true }
      ts_authkey:         { description: "Tailscale Auth key", required: true }
      quick_test:         { description: "Run 5-minute test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime (max 360)", required: false, default: "355" }
      do_purge:           { description: "Purge bullet* devices", required: false, default: "true" }
      cycles:             { description: "0=stop after A; N=handoffs", required: false, default: "0" }
      rdp_count:          { description: "How many RDP instances (1-10)", required: false, default: "1" }
      crd_code:
        description: "CRD code (4/0AV...)"
        required: false
        default: ""
      crd_pin:
        description: "CRD PIN (6–12 digits)"
        required: false
        default: "123456"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi:  ${{ steps.mk.outputs.multi }}
    steps:
      - id: mk
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          if ($crd.Length -gt 0) { $n = 1 } else {
            $n = [int]"${{ inputs.rdp_count }}"; if ($n -lt 1) { $n = 1 }; if ($n -gt 10) { $n = 10 }
          }
          $inc = @(); for ($i=1; $i -le $n; $i++){ $inc += @{ id = $i } }
          $json = @{ include = $inc } | ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $multi = if ($n -gt 1) { '1' } else { '0' }
          "multi=$multi" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  rdp:
    needs: setup
    runs-on: windows-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10
    timeout-minutes: 370
    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345

    steps:
      # ============ FIX STREAMING DI RDP ============
      - name: Keep session alive saat disconnect
        run: |
          # Matiin idle timeout biar gak auto logout
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fResetBrokenOnTimeout" -Value 0 -Type DWord
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Type DWord
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0 -Type DWord
          
          # Set timeout disconnected session jadi 0 (never)
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "MaxDisconnectionTime" -Value 0 -Type DWord
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "MaxConnectionTime" -Value 0 -Type DWord
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "MaxIdleTime" -Value 0 -Type DWord
          
          # Biar aplikasi tetep jalan walau RDP disconnect
          New-Item -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserTimeout" -Force | Out-Null
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserTimeout" -Value 0 -Type DWord
          
          # Matiin session lock saat disconnect
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "fDisableAutoReconnect" -Value 1 -Type DWord
          
          Write-Host "✅ RDP session settings applied — streaming aman walau disconnect!"

      - name: Bypass RDP idle limit via gpedit registry
        run: |
          # Group policy override biar session gak mati
          $regPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $regPath -Force | Out-Null
          Set-ItemProperty -Path $regPath -Name "fResetBrokenOnTimeout" -Value 0 -Type DWord
          Set-ItemProperty -Path $regPath -Name "MaxDisconnectionTime" -Value 0 -Type DWord
          Set-ItemProperty -Path $regPath -Name "MaxConnectionTime" -Value 0 -Type DWord
          Set-ItemProperty -Path $regPath -Name "MaxIdleTime" -Value 0 -Type DWord
          Write-Host "✅ Group Policy registry applied"

      - name: Prevent Windows lock saat disconnect RDP
        run: |
          # Biar gak lock screen saat RDP disconnect
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "InactivityTimeoutSecs" -Value 0 -Type DWord
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "PromptOnSecureDesktop" -Value 0 -Type DWord
          
          # Matiin screen saver
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "ScreenSaveActive" -Value "0" -Type String
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "SCRNSAVE.EXE" -Value "" -Type String
          
          # Matiin lock screen
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization" -Name "NoLockScreen" -Value 1 -Type DWord
          Write-Host "✅ Lock screen & screen saver disabled"

      - name: Keep console session active dengan script
        run: |
          # Buat script keepalive biar session gak dianggap idle
          $script = @'
          while ($true) {
            Write-Host "KEEPALIVE: $(Get-Date) - Session aktif!"
            Start-Sleep -Seconds 30
          }
          '@
          $scriptPath = "$env:TEMP\keepalive.ps1"
          Set-Content -Path $scriptPath -Value $script -Encoding UTF8
          
          # Jalankan di background
          Start-Process powershell -ArgumentList "-WindowStyle Hidden -ExecutionPolicy Bypass -File `"$scriptPath`"" -WindowStyle Hidden
          Write-Host "✅ Keepalive script jalan di background"

      # ============ CRD INSTALL ============
      - name: Set CRD flag early
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          if ($crd.Length -gt 0) { "CRD_ENABLED=1" | Out-File -Append $env:GITHUB_ENV } else { "CRD_ENABLED=0" | Out-File -Append $env:GITHUB_ENV }

      - name: Install CRD Host
        if: env.CRD_ENABLED == '1'
        run: |
          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $exe)) {
            $exePath = "$env:TEMP\chromeremotedesktophost.exe"
            $ok = $false
            try {
              Invoke-WebRequest -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" -OutFile $exePath -ErrorAction Stop
              Start-Process -FilePath $exePath -ArgumentList "/silent","/install" -Wait
              Remove-Item $exePath -Force
              $ok = $true
            } catch {
              Write-Host "EXE failed, trying MSI..."
            }
            if (-not $ok) {
              $msi = "$env:TEMP\chromeremotedesktophost.msi"
              Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile $msi -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait
              Remove-Item $msi -Force
            }
          }

      - name: Run CRD with PIN
        if: env.CRD_ENABLED == '1'
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          $pin = "${{ inputs.crd_pin }}".Trim()
          if ($pin -notmatch '^\d{6,12}$') { Write-Error "PIN must be 6-12 digits"; exit 1 }
          $starter = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $starter)) { Write-Error "CRD host not found"; exit 1 }
          if ($raw -match '--code\s*=\s*"?([^"\s]+)') { $code = ([regex]::Match($raw,'--code\s*=\s*"?([^"\s]+)')).Groups[1].Value }
          elseif ($raw -match '^4\/') { $code = $raw }
          if ($code) {
            $redir = "https://remotedesktop.google.com/_/oauthredirect"
            $name  = $Env:COMPUTERNAME
            Start-Process -FilePath $starter -ArgumentList "--code=""$code""","--redirect-url=""$redir""","--name=""$name""","--pin=""$pin"""
            Write-Host "✅ CRD launched with PIN"
          }

      # ============ TAILSCALE + RDP ============
      - name: Decide hostname + runtime
        run: |
          if ("${{ inputs.rdp_count }}" -gt 1) { $hn = "bullet${{ matrix.id }}" } else { $hn = "bullet" }
          "TS_HOSTNAME=$hn" | Out-File -Append $env:GITHUB_ENV
          $runtime = [int]"${{ inputs.runtime_minutes }}"
          if ("${{ inputs.quick_test }}" -eq "true") { $runtime = 5 }
          if ($runtime -gt 360) { $runtime = 355 }
          if ($runtime -lt 6 -and "${{ inputs.quick_test }}" -ne "true") { $runtime = 355 }
          "RUNTIME_MINUTES=$runtime" | Out-File -Append $env:GITHUB_ENV

      - name: Purge bullet* devices (single-instance)
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |
          if ("${{ inputs.do_purge }}" -eq "true") {
            $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${{ inputs.ts_api_key }}:"))
            $tn = [uri]::EscapeDataString("${{ inputs.ts_tailnet }}")
            $list = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices" -Headers @{ Authorization = "Basic $auth" }
            foreach($d in $list.devices){
              if ($d.hostname -match '^bullet[0-9]*$'){
                Invoke-RestMethod -Method Delete -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" -Headers @{ Authorization = "Basic $auth" } -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Install + Up Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $dst = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $url -OutFile $dst
            Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
            Remove-Item $dst -Force
          }
          & $ts logout 2>$null
          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname "$env:TS_HOSTNAME" --accept-dns=true --accept-routes=true
          $ip4 = & $ts ip -4 | Select-Object -First 1
          "TAILSCALE_IP=$ip4" | Out-File -Append $env:GITHUB_ENV
          Write-Host "✅ Tailscale IP: $ip4"

      - name: Enable RDP
        run: |
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
          }
          Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $u -EA SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -EA SilentlyContinue
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" 2>$null
          Write-Host "✅ RDP: $u / $p @ $env:TAILSCALE_IP"

      - name: Install RustDesk
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rdExe)) {
            try {
              $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"
              $dst = "$env:TEMP\rustdesk.msi"
              Invoke-WebRequest -Uri $url -OutFile $dst
              Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
              Remove-Item $dst -Force
            } catch {
              winget install --id RustDesk.RustDesk -e --silent --accept-package-agreements --accept-source-agreements
            }
          }

      - name: Launch RustDesk + screenshot
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (Test-Path $rdExe) { Start-Process $rdExe -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 5
          
          # Screenshot
          Add-Type -AssemblyName "System.Windows.Forms","System.Drawing"
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $ss = "$env:TEMP\ss_${{ matrix.id }}.png"
          $bitmap.Save($ss, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()
          
          $result = curl.exe -s -F "file=@$ss" https://store1.gofile.io/uploadFile
          $json = $result | ConvertFrom-Json
          if ($json.status -eq "ok") { "SCREENSHOT_URL=$($json.data.downloadPage)" | Out-File -Append $env:GITHUB_ENV }
          Write-Host "✅ Screenshot: $env:SCREENSHOT_URL"

      - name: KEEP ALIVE + STREAMING AMAN
        run: |
          $mins = [int]"$env:RUNTIME_MINUTES"
          $end = (Get-Date).AddMinutes($mins)
          $msg = "🔥 STREAMING AKTIF - JANGAN LOGOUT! Tutup jendela RDP aja pake X"
          Write-Host $msg
          while ((Get-Date) -lt $end) {
            Write-Host "💀 $(Get-Date) | $msg | SS: $env:SCREENSHOT_URL"
            Start-Sleep -Seconds 60
          }

      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cycles = [int]"${{ inputs.cycles }}"
          if ($cycles -gt 0) {
            $next = $cycles - 1
            if ($next -le 0) {
              $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"
              $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $body = @{ ref="${{ github.ref_name }}"; inputs = @{ ts_tailnet="${{ inputs.ts_tailnet }}"; ts_api_key="${{ inputs.ts_api_key }}"; base_prefix="bullet"; max_count="10"; dry_run="false" } } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body | Out-Null
            } else {
              $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-B.yml/dispatches"
              $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $payload = @{ ts_tailnet="${{ inputs.ts_tailnet }}"; ts_api_key="${{ inputs.ts_api_key }}"; ts_authkey="${{ inputs.ts_authkey }}"; quick_test="${{ inputs.quick_test }}"; runtime_minutes="${{ inputs.runtime_minutes }}"; do_purge="${{ inputs.do_purge }}"; cycles="$next"; rdp_count="${{ inputs.rdp_count }}"; crd_code="${{ inputs.crd_code }}"; crd_pin="${{ inputs.crd_pin }}" }
              $body = @{ ref="${{ github.ref_name }}"; inputs = $payload } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body | Out-Null
            }
          }
