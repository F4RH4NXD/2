name: RDP + Tailscale + RustDesk + CRD (FIX RECONNECT)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet", required: true }
      ts_api_key:         { description: "Tailscale API key", required: true }
      ts_authkey:         { description: "Tailscale Auth key", required: true }
      quick_test:         { description: "Run 5-minute test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime (max 360)", required: false, default: "355" }
      do_purge:           { description: "Purge bullet* devices", required: false, default: "false" }
      cycles:             { description: "0=stop after A; N=handoffs", required: false, default: "0" }
      rdp_count:          { description: "How many RDP instances (1-10)", required: false, default: "1" }
      crd_code:
        description: "CRD code (4/0AV...)"
        required: false
        default: ""
      crd_pin:
        description: "CRD PIN (6–12 digits)"
        required: false
        default: "123456"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi:  ${{ steps.mk.outputs.multi }}
    steps:
      - id: mk
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          if ($crd.Length -gt 0) { $n = 1 } else {
            $n = [int]"${{ inputs.rdp_count }}"; if ($n -lt 1) { $n = 1 }; if ($n -gt 10) { $n = 10 }
          }
          $inc = @(); for ($i=1; $i -le $n; $i++){ $inc += @{ id = $i } }
          $json = @{ include = $inc } | ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $multi = if ($n -gt 1) { '1' } else { '0' }
          "multi=$multi" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  rdp:
    needs: setup
    runs-on: windows-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10
    timeout-minutes: 370
    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345

    steps:
      # ============ FIX: KEEP SESSION ACTIVE ============
      - name: FIX SESSION - BIAR GA DISCONNECT
        run: |
          Write-Host "🔥 FIXING RDP/RUSTDESK SESSION RECONNECT ISSUE 🔥"
          
          # 1. Matiin semua timeout (udah ada tapi tambahin)
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fResetBrokenOnTimeout" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "MaxDisconnectionTime" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "MaxIdleTime" -Value 0 -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserTimeout" -Value 0 -Force -ErrorAction SilentlyContinue
          
          # 2. BIARIN SESSION TETAP AKTIF WALAU RDP DITUTUP
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0 -Force -ErrorAction SilentlyContinue
          
          # 3. MATIIN AUTOMATIC DISCONNECT SAAT RDP TUTUP
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fAllowRemoteRPC" -Value 1 -Force -ErrorAction SilentlyContinue
          
          # 4. SET SESSION CONSOLE TETAP AKTIF
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "fDisableAutoReconnect" -Value 0 -Force -ErrorAction SilentlyContinue
          
          Write-Host "✅ SESSION FIX APPLIED!"

      - name: SET RDP TO CONSOLE MODE - BIAR REKONEK
        run: |
          Write-Host "🔥 SETTING RDP TO CONSOLE MODE 🔥"
          
          # Ubah session jadi console biar gak disconnect
          $session = (qwinsta | Select-String ">console" | ForEach-Object { ($_ -split '\s+')[2] }) -replace '[^0-9]', ''
          if ($session) {
            tscon $session /dest:console 2>$null
            Write-Host "✅ Session moved to console: $session"
          }
          
          # Biar session selalu di console
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "AllowRemoteRPC" -Value 1 -Force -ErrorAction SilentlyContinue
          
          Write-Host "✅ RDP CONSOLE MODE ENABLED!"

      - name: KEEPALIVE + RUSTDESK AUTO-RECONNECT
        run: |
          Write-Host "🔥 ACTIVATING RUSTDESK AUTO-RECONNECT 🔥"
          
          # Buat script buat restart RustDesk kalo mati
          $rustScript = @'
          while ($true) {
            $proc = Get-Process -Name "rustdesk" -ErrorAction SilentlyContinue
            if (-not $proc) {
              Write-Host "RustDesk mati! Restarting..."
              Start-Process "C:\Program Files\RustDesk\rustdesk.exe"
            }
            Start-Sleep -Seconds 10
          }
          '@
          Set-Content -Path "$env:TEMP\rustkeepalive.ps1" -Value $rustScript -Encoding UTF8
          Start-Process powershell -ArgumentList "-WindowStyle Hidden -ExecutionPolicy Bypass -File `"$env:TEMP\rustkeepalive.ps1`"" -WindowStyle Hidden
          
          # Buat script buat reconnect RDP session
          $rdpScript = @'
          while ($true) {
            $session = qwinsta | Select-String "disc"
            if ($session) {
              Write-Host "Found disconnected session! Reconnecting..."
              $sid = ($session -split '\s+')[2] -replace '[^0-9]', ''
              if ($sid) { tscon $sid /dest:console 2>$null }
            }
            Start-Sleep -Seconds 30
          }
          '@
          Set-Content -Path "$env:TEMP\rdpreconnect.ps1" -Value $rdpScript -Encoding UTF8
          Start-Process powershell -ArgumentList "-WindowStyle Hidden -ExecutionPolicy Bypass -File `"$env:TEMP\rdpreconnect.ps1`"" -WindowStyle Hidden
          
          Write-Host "✅ AUTO-RECONNECT ACTIVATED!"

      - name: CRD Setup
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          if ($crd.Length -gt 0) { 
            "CRD_ENABLED=1" | Out-File -Append $env:GITHUB_ENV
          } else { 
            "CRD_ENABLED=0" | Out-File -Append $env:GITHUB_ENV 
          }

      - name: Install CRD
        if: env.CRD_ENABLED == '1'
        run: |
          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $exe)) {
            $exePath = "$env:TEMP\chromeremotedesktophost.exe"
            try {
              Invoke-WebRequest -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" -OutFile $exePath -ErrorAction Stop
              Start-Process -FilePath $exePath -ArgumentList "/silent","/install" -Wait
              Remove-Item $exePath -Force
            } catch {
              $msi = "$env:TEMP\chromeremotedesktophost.msi"
              Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile $msi -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait
              Remove-Item $msi -Force
            }
          }

      - name: Run CRD
        if: env.CRD_ENABLED == '1'
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          $pin = "${{ inputs.crd_pin }}".Trim()
          $starter = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $starter)) { exit 1 }
          if ($raw -match '--code\s*=\s*"?([^"\s]+)') { $code = ([regex]::Match($raw,'--code\s*=\s*"?([^"\s]+)')).Groups[1].Value }
          elseif ($raw -match '^4\/') { $code = $raw }
          if ($code) {
            Start-Process -FilePath $starter -ArgumentList "--code=""$code""","--redirect-url=""https://remotedesktop.google.com/_/oauthredirect""","--name=""$Env:COMPUTERNAME""","--pin=""$pin"""
          }

      - name: Tailscale + RDP
        run: |
          $hn = if ("${{ inputs.rdp_count }}" -gt 1) { "bullet${{ matrix.id }}" } else { "bullet" }
          "TS_HOSTNAME=$hn" | Out-File -Append $env:GITHUB_ENV
          $runtime = [int]"${{ inputs.runtime_minutes }}"
          if ("${{ inputs.quick_test }}" -eq "true") { $runtime = 5 }
          if ($runtime -gt 360) { $runtime = 355 }
          if ($runtime -lt 6 -and "${{ inputs.quick_test }}" -ne "true") { $runtime = 355 }
          "RUNTIME_MINUTES=$runtime" | Out-File -Append $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $dst = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $url -OutFile $dst
            Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
            Remove-Item $dst -Force
          }
          & $ts logout 2>$null
          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname "$env:TS_HOSTNAME" --accept-dns=true --accept-routes=true
          $ip4 = & $ts ip -4 | Select-Object -First 1
          "TAILSCALE_IP=$ip4" | Out-File -Append $env:GITHUB_ENV
          Write-Host "✅ Tailscale IP: $ip4"

      - name: Enable RDP + CONSOLE
        run: |
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
          }
          Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $u -EA SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -EA SilentlyContinue
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" 2>$null
          
          # Set console session biar bisa reconnect
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "AllowRemoteRPC" -Value 1 -Force
          
          Write-Host "✅ RDP READY: $u / $p @ $env:TAILSCALE_IP"
          Write-Host "✅ CONSOLE MODE ENABLED - REKONEK BISA!"

      - name: Install RustDesk + SET PASSWORD
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rdExe)) {
            try {
              $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"
              $dst = "$env:TEMP\rustdesk.msi"
              Invoke-WebRequest -Uri $url -OutFile $dst
              Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
              Remove-Item $dst -Force
            } catch {
              winget install --id RustDesk.RustDesk -e --silent --accept-package-agreements --accept-source-agreements 2>$null
            }
          }
          
          # Set RustDesk password biar auto login
          $rdConfig = "$env:APPDATA\RustDesk\config\RustDesk.toml"
          New-Item -Path "$env:APPDATA\RustDesk\config" -ItemType Directory -Force -ErrorAction SilentlyContinue
          @"
[options]
password = "Bullet@12345"
password-check = true
allow-only-one-instance = false
"@ | Out-File -FilePath $rdConfig -Encoding UTF8 -Force

      - name: Launch RustDesk + Screenshot
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (Test-Path $rdExe) { 
            Start-Process $rdExe -ErrorAction SilentlyContinue
            Write-Host "✅ RustDesk launched!"
          }
          Start-Sleep -Seconds 10
          
          # Screenshot
          Add-Type -AssemblyName "System.Windows.Forms","System.Drawing"
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $ss = "$env:TEMP\ss_${{ matrix.id }}.png"
          $bitmap.Save($ss, [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()
          
          try {
            $result = curl.exe -s -F "file=@$ss" https://store1.gofile.io/uploadFile
            $json = $result | ConvertFrom-Json
            if ($json.status -eq "ok") { "SCREENSHOT_URL=$($json.data.downloadPage)" | Out-File -Append $env:GITHUB_ENV }
          } catch { Write-Host "Screenshot upload skipped" }

      - name: ULTIMATE SESSION KEEPALIVE
        run: |
          $mins = [int]"$env:RUNTIME_MINUTES"
          $end = (Get-Date).AddMinutes($mins)
          
          Write-Host "████████████████████████████████████████████████████████████████"
          Write-Host "█                                                              █"
          Write-Host "█     🔥 SESSION AMAN - REKONEK BISA! 🔥                      █"
          Write-Host "█                                                              █"
          Write-Host "█     💀 TUTUP RDP/RUSTDESK PAKE TOMBOL X! 💀                 █"
          Write-Host "█     💀 REKONEK LAGI PAKE RUSTDESK ATAU RDP 💀              █"
          Write-Host "█                                                              █"
          Write-Host "█     📡 TAILSCALE IP: $env:TAILSCALE_IP                 █"
          Write-Host "█     👤 USER: $env:RDP_USER / PASS: $env:RDP_PASS █"
          Write-Host "█     📸 SCREENSHOT: $env:SCREENSHOT_URL █"
          Write-Host "█                                                              █"
          Write-Host "████████████████████████████████████████████████████████████████"
          
          while ((Get-Date) -lt $end) {
            # Cek disconnected session dan reconnect
            $disc = qwinsta | Select-String "disc"
            if ($disc) {
              $sid = ($disc -split '\s+')[2] -replace '[^0-9]', ''
              if ($sid) { 
                tscon $sid /dest:console 2>$null
                Write-Host "✅ Reconnected session: $sid"
              }
            }
            
            # Cek RustDesk masih jalan
            $proc = Get-Process -Name "rustdesk" -ErrorAction SilentlyContinue
            if (-not $proc) {
              Start-Process "C:\Program Files\RustDesk\rustdesk.exe" -ErrorAction SilentlyContinue
              Write-Host "✅ RustDesk restarted!"
            }
            
            Write-Host "💀 $(Get-Date) | SESSION AKTIF! | SS: $env:SCREENSHOT_URL"
            Start-Sleep -Seconds 30
          }

      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cycles = [int]"${{ inputs.cycles }}"
          if ($cycles -gt 0) {
            $next = $cycles - 1
            if ($next -le 0) {
              $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"
              $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $body = @{ ref="${{ github.ref_name }}"; inputs = @{ ts_tailnet="${{ inputs.ts_tailnet }}"; ts_api_key="${{ inputs.ts_api_key }}"; base_prefix="bullet"; max_count="10"; dry_run="false" } } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body | Out-Null
            } else {
              $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-B.yml/dispatches"
              $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $payload = @{ ts_tailnet="${{ inputs.ts_tailnet }}"; ts_api_key="${{ inputs.ts_api_key }}"; ts_authkey="${{ inputs.ts_authkey }}"; quick_test="${{ inputs.quick_test }}"; runtime_minutes="${{ inputs.runtime_minutes }}"; do_purge="false"; cycles="$next"; rdp_count="${{ inputs.rdp_count }}"; crd_code="${{ inputs.crd_code }}"; crd_pin="${{ inputs.crd_pin }}" }
              $body = @{ ref="${{ github.ref_name }}"; inputs = $payload } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body | Out-Null
            }
          }
