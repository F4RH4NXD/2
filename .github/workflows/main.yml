name: RDP + Tailscale + RustDesk + CRD (ULTIMATE STREAMING FIX)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet (masukkan nama tailnet, BUKAN email)", required: true }
      ts_api_key:         { description: "Tailscale API key", required: true }
      ts_authkey:         { description: "Tailscale Auth key", required: true }
      quick_test:         { description: "Run 5-minute test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime (max 360)", required: false, default: "355" }
      do_purge:           { description: "Purge bullet* devices", required: false, default: "false" }
      cycles:             { description: "0=stop after A; N=handoffs", required: false, default: "0" }
      rdp_count:          { description: "How many RDP instances (1-10)", required: false, default: "1" }
      crd_code:
        description: "CRD code (4/0AV...)"
        required: false
        default: ""
      crd_pin:
        description: "CRD PIN (6–12 digits)"
        required: false
        default: "123456"
      rustdesk_password:
        description: "RustDesk password (biar bisa reconnect)"
        required: false
        default: "BulletRust123"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi:  ${{ steps.mk.outputs.multi }}
    steps:
      - id: mk
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          if ($crd.Length -gt 0) { $n = 1 } else {
            $n = [int]"${{ inputs.rdp_count }}"; if ($n -lt 1) { $n = 1 }; if ($n -gt 10) { $n = 10 }
          }
          $inc = @(); for ($i=1; $i -le $n; $i++){ $inc += @{ id = $i } }
          $json = @{ include = $inc } | ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $multi = if ($n -gt 1) { '1' } else { '0' }
          "multi=$multi" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  rdp:
    needs: setup
    runs-on: windows-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10
    timeout-minutes: 370
    env:
      RDP_USER: Bullettemporary
      RDP_PASS: Bullet@12345
      RUSTDESK_PASS: ${{ inputs.rustdesk_password }}

    steps:
      # ============ ULTIMATE SESSION KEEPALIVE ============
      - name: PREVENT SESSION LOCK + TIMEOUT
        run: |
          Write-Host "🔥🔥🔥 PREVENTING SESSION LOCK & TIMEOUT 🔥🔥🔥"
          
          # 1. Matiin semua timeout RDP
          $regPaths = @(
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server",
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp",
            "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          )
          
          foreach ($path in $regPaths) {
            New-Item -Path $path -Force -ErrorAction SilentlyContinue | Out-Null
            Set-ItemProperty -Path $path -Name "MaxDisconnectionTime" -Value 0 -Type DWord -ErrorAction SilentlyContinue
            Set-ItemProperty -Path $path -Name "MaxConnectionTime" -Value 0 -Type DWord -ErrorAction SilentlyContinue
            Set-ItemProperty -Path $path -Name "MaxIdleTime" -Value 0 -Type DWord -ErrorAction SilentlyContinue
            Set-ItemProperty -Path $path -Name "fResetBrokenOnTimeout" -Value 0 -Type DWord -ErrorAction SilentlyContinue
          }
          
          # 2. Matiin lock screen & screen saver
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "InactivityTimeoutSecs" -Value 0 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "PromptOnSecureDesktop" -Value 0 -Type DWord -ErrorAction SilentlyContinue
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization" -Name "NoLockScreen" -Value 1 -Type DWord -ErrorAction SilentlyContinue
          
          # 3. Matiin power saving
          powercfg -change -monitor-timeout-ac 0 2>$null
          powercfg -change -monitor-timeout-dc 0 2>$null
          powercfg -change -standby-timeout-ac 0 2>$null
          powercfg -change -standby-timeout-dc 0 2>$null
          powercfg -change -hibernate-timeout-ac 0 2>$null
          powercfg -change -hibernate-timeout-dc 0 2>$null
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          
          # 4. Matiin Windows lock screen via group policy
          New-Item -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Force -ErrorAction SilentlyContinue | Out-Null
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Name "DisableLockScreenAppNotifications" -Value 1 -Type DWord -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\System" -Name "EnableFirstLogonAnimation" -Value 0 -Type DWord -ErrorAction SilentlyContinue
          
          Write-Host "✅ SESSION LOCK & TIMEOUT DISABLED!"

      - name: SET RUSTDESK PERMANENT PASSWORD + AUTO CONNECT
        run: |
          Write-Host "🔥 SETTING RUSTDESK PERMANENT PASSWORD 🔥"
          
          # Kill RustDesk if running
          Get-Process -Name "rustdesk" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          
          # Install RustDesk
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rdExe)) {
            try {
              $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"
              $dst = "$env:TEMP\rustdesk.msi"
              Invoke-WebRequest -Uri $url -OutFile $dst -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i `"$dst`" /quiet /norestart" -Wait
              Remove-Item $dst -Force
            } catch {
              winget install --id RustDesk.RustDesk -e --silent --accept-package-agreements --accept-source-agreements 2>$null
            }
          }
          
          # Run RustDesk
          Start-Process -FilePath $rdExe
          Start-Sleep -Seconds 5
          
          # Set permanent password via config file
          $configDir = "$env:AppData\RustDesk\config"
          New-Item -Path $configDir -ItemType Directory -Force -ErrorAction SilentlyContinue | Out-Null
          
          # Create config with permanent password
          $config = @"
          {
            "password": "$env:RUSTDESK_PASS",
            "allow-permanent-password": true,
            "server-address": "rustdesk.com",
            "rendezvous-server": "rustdesk.com",
            "nat-type": 0,
            "relay-servers": "rustdesk.com"
          }
          "@
          $config | Out-File -FilePath "$configDir\RustDesk2.toml" -Encoding UTF8
          
          # Restart RustDesk with permanent password
          Get-Process -Name "rustdesk" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Start-Process -FilePath $rdExe -ArgumentList "--password $env:RUSTDESK_PASS"
          Start-Sleep -Seconds 5
          
          # Get RustDesk ID
          $rdId = ""
          try {
            $configFile = "$env:AppData\RustDesk\config\RustDesk.toml"
            if (Test-Path $configFile) {
              $content = Get-Content $configFile -Raw
              if ($content -match 'id\s*=\s*"(\d+)"') {
                $rdId = $matches[1]
              }
            }
          } catch { }
          
          Write-Host "✅ RUSTDESK CONFIGURED!"
          Write-Host "🔐 RUSTDESK ID: $rdId"
          Write-Host "🔑 RUSTDESK PASSWORD: $env:RUSTDESK_PASS"
          
          # Save to env
          "RUSTDESK_ID=$rdId" | Out-File -Append $env:GITHUB_ENV

      - name: CRD Setup
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          if ($crd.Length -gt 0) { 
            "CRD_ENABLED=1" | Out-File -Append $env:GITHUB_ENV
          } else { 
            "CRD_ENABLED=0" | Out-File -Append $env:GITHUB_ENV 
          }

      - name: Install CRD
        if: env.CRD_ENABLED == '1'
        run: |
          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $exe)) {
            $exePath = "$env:TEMP\chromeremotedesktophost.exe"
            try {
              Invoke-WebRequest -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" -OutFile $exePath -ErrorAction Stop
              Start-Process -FilePath $exePath -ArgumentList "/silent","/install" -Wait
              Remove-Item $exePath -Force
            } catch {
              $msi = "$env:TEMP\chromeremotedesktophost.msi"
              Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile $msi -ErrorAction Stop
              Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait
              Remove-Item $msi -Force
            }
          }

      - name: Run CRD
        if: env.CRD_ENABLED == '1'
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()
          $pin = "${{ inputs.crd_pin }}".Trim()
          $starter = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          if (-not (Test-Path $starter)) { exit 1 }
          if ($raw -match '--code\s*=\s*"?([^"\s]+)') { $code = ([regex]::Match($raw,'--code\s*=\s*"?([^"\s]+)')).Groups[1].Value }
          elseif ($raw -match '^4\/') { $code = $raw }
          if ($code) {
            Start-Process -FilePath $starter -ArgumentList "--code=""$code""","--redirect-url=""https://remotedesktop.google.com/_/oauthredirect""","--name=""$Env:COMPUTERNAME""","--pin=""$pin"""
          }

      - name: Tailscale Setup
        run: |
          $hn = if ("${{ inputs.rdp_count }}" -gt 1) { "bullet${{ matrix.id }}" } else { "bullet" }
          "TS_HOSTNAME=$hn" | Out-File -Append $env:GITHUB_ENV
          $runtime = [int]"${{ inputs.runtime_minutes }}"
          if ("${{ inputs.quick_test }}" -eq "true") { $runtime = 5 }
          if ($runtime -gt 360) { $runtime = 355 }
          if ($runtime -lt 6 -and "${{ inputs.quick_test }}" -ne "true") { $runtime = 355 }
          "RUNTIME_MINUTES=$runtime" | Out-File -Append $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $dst = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $url -OutFile $dst
            Start-Process msiexec.exe -ArgumentList "/i","`"$dst`"","/quiet","/norestart" -Wait
            Remove-Item $dst -Force
          }
          & $ts logout 2>$null
          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname "$env:TS_HOSTNAME" --accept-dns=true --accept-routes=true
          $ip4 = & $ts ip -4 | Select-Object -First 1
          "TAILSCALE_IP=$ip4" | Out-File -Append $env:GITHUB_ENV
          Write-Host "✅ Tailscale IP: $ip4"

      - name: Enable RDP + Firewall
        run: |
          # Enable RDP
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          
          # Create user
          $u=$env:RDP_USER; $p=$env:RDP_PASS
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -EA SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
          }
          Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $u -EA SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -EA SilentlyContinue
          
          # Firewall rules
          New-NetFirewallRule -DisplayName "RDP-3389" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RustDesk-TCP" -Direction Inbound -Protocol TCP -LocalPort 21115-21119 -Action Allow -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RustDesk-UDP" -Direction Inbound -Protocol UDP -LocalPort 21116 -Action Allow -ErrorAction SilentlyContinue
          
          Write-Host "✅ RDP & RUSTDESK PORTS OPEN"

      - name: ULTIMATE KEEPALIVE (RUN FOREVER)
        run: |
          # MULTI-LAYER KEEPALIVE
          
          # Layer 1: PowerShell
          $ps1 = @'
          while ($true) {
            Write-Host "💀 KEEPALIVE: $(Get-Date) - STREAMING AKTIF!"
            Start-Sleep -Seconds 10
          }
          '@
          Set-Content -Path "$env:TEMP\keepalive1.ps1" -Value $ps1 -Encoding UTF8
          Start-Process powershell -ArgumentList "-WindowStyle Hidden -ExecutionPolicy Bypass -File `"$env:TEMP\keepalive1.ps1`"" -WindowStyle Hidden
          
          # Layer 2: VBS
          $vbs = @'
          Do While True
            WScript.Sleep 10000
          Loop
          '@
          Set-Content -Path "$env:TEMP\keepalive2.vbs" -Value $vbs -Encoding UTF8
          Start-Process wscript -ArgumentList "$env:TEMP\keepalive2.vbs" -WindowStyle Hidden
          
          # Layer 3: CMD
          $cmd = @'
          @echo off
          :loop
          echo KEEPALIVE - STREAMING ACTIVE
          timeout /t 10 /nobreak >nul
          goto loop
          '@
          Set-Content -Path "$env:TEMP\keepalive3.cmd" -Value $cmd -Encoding ASCII
          Start-Process cmd -ArgumentList "/c start /min `"$env:TEMP\keepalive3.cmd`"" -WindowStyle Hidden
          
          # Layer 4: Scheduled Task
          $taskXml = @'
          <?xml version="1.0" encoding="UTF-16"?>
          <Task version="1.2" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task">
            <Triggers>
              <BootTrigger><Enabled>true</Enabled></BootTrigger>
              <SessionStateChangeTrigger><Enabled>true</Enabled><StateChange>SessionUnlock</StateChange></SessionStateChangeTrigger>
              <TimeTrigger><Enabled>true</Enabled><StartBoundary>2024-01-01T00:00:00</StartBoundary><Repetition><Interval>PT1M</Interval><Duration>PT0S</Duration></Repetition></TimeTrigger>
            </Triggers>
            <Settings>
              <DisallowStartIfOnBatteries>false</DisallowStartIfOnBatteries>
              <StopIfGoingOnBatteries>false</StopIfGoingOnBatteries>
              <WakeToRun>true</WakeToRun>
              <ExecutionTimeLimit>PT0S</ExecutionTimeLimit>
              <Priority>4</Priority>
            </Settings>
            <Actions Context="Author">
              <Exec><Command>powershell.exe</Command><Arguments>-WindowStyle Hidden -ExecutionPolicy Bypass -Command "while($true){Start-Sleep 30}"</Arguments></Exec>
            </Actions>
          </Task>
          '@
          $taskXml | Out-File -FilePath "$env:TEMP\keepalive_task.xml" -Encoding UTF8
          schtasks /create /tn "StreamingKeepalive" /xml "$env:TEMP\keepalive_task.xml" /f 2>$null
          schtasks /run /tn "StreamingKeepalive" 2>$null
          
          Write-Host "✅ 4 LAYERS KEEPALIVE ACTIVATED!"

      - name: Display Connection Info
        run: |
          Write-Host "████████████████████████████████████████████████████████████████"
          Write-Host "█                                                              █"
          Write-Host "█     🔥 ULTIMATE STREAMING PROTECTION ACTIVE! 🔥            █"
          Write-Host "█                                                              █"
          Write-Host "█     📡 TAILSCALE IP: $env:TAILSCALE_IP                     █"
          Write-Host "█     👤 RDP USER: $env:RDP_USER                             █"
          Write-Host "█     🔑 RDP PASS: $env:RDP_PASS                             █"
          Write-Host "█                                                              █"
          Write-Host "█     🔐 RUSTDESK ID: $env:RUSTDESK_ID                       █"
          Write-Host "█     🔑 RUSTDESK PASS: $env:RUSTDESK_PASS                   █"
          Write-Host "█                                                              █"
          Write-Host "█     💀 TUTUP RDP PAKE TOMBOL X - JANGAN LOGOUT! 💀          █"
          Write-Host "█     🔄 RUSTDESK BISA RECONNECT PAKE PASSWORD!               █"
          Write-Host "█                                                              █"
          Write-Host "████████████████████████████████████████████████████████████████"

      - name: ULTIMATE STREAMING KEEPALIVE
        run: |
          $mins = [int]"$env:RUNTIME_MINUTES"
          $end = (Get-Date).AddMinutes($mins)
          while ((Get-Date) -lt $end) {
            Write-Host "💀 $(Get-Date) | STREAMING AKTIF! RUSTDESK ID: $env:RUSTDESK_ID"
            Start-Sleep -Seconds 30
          }

      - name: Dispatch next or stop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cycles = [int]"${{ inputs.cycles }}"
          if ($cycles -gt 0) {
            $next = $cycles - 1
            if ($next -le 0) {
              $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-stop.yml/dispatches"
              $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $body = @{ ref="${{ github.ref_name }}"; inputs = @{ ts_tailnet="${{ inputs.ts_tailnet }}"; ts_api_key="${{ inputs.ts_api_key }}"; base_prefix="bullet"; max_count="10"; dry_run="false" } } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body | Out-Null
            } else {
              $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/rdp-tailscale-B.yml/dispatches"
              $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $payload = @{ ts_tailnet="${{ inputs.ts_tailnet }}"; ts_api_key="${{ inputs.ts_api_key }}"; ts_authkey="${{ inputs.ts_authkey }}"; quick_test="${{ inputs.quick_test }}"; runtime_minutes="${{ inputs.runtime_minutes }}"; do_purge="false"; cycles="$next"; rdp_count="${{ inputs.rdp_count }}"; crd_code="${{ inputs.crd_code }}"; crd_pin="${{ inputs.crd_pin }}"; rustdesk_password="${{ inputs.rustdesk_password }}" }
              $body = @{ ref="${{ github.ref_name }}"; inputs = $payload } | ConvertTo-Json -Depth 20
              Invoke-WebRequest -Method POST -Uri $url -Headers $hdr -Body $body | Out-Null
            }
          }
